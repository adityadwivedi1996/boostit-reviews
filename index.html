<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share your experience</title>
<style>
:root{--accent:#ff7a00;--accent2:#e8101a;--navy:#17202c;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#ffe9d6,#fff 55%);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:20px}
.wrap{width:100%;max-width:440px;text-align:center}
.logo{width:110px;height:110px;object-fit:contain;margin:10px auto;display:block;border-radius:50%}
h1{font-size:21px;font-weight:800;margin:10px 0 6px;letter-spacing:-.2px}
h2{font-size:13px;color:var(--muted);font-weight:600;margin:20px 0 10px;text-transform:uppercase;letter-spacing:.6px}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{background:none;border:0;font-size:42px;cursor:pointer;color:#e5e7eb;padding:0;transition:transform .15s}
.stars button:active{transform:scale(1.2)}
.stars button.on{color:#fbbf24}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--navy);padding:9px 16px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
textarea{width:100%;min-height:130px;background:#fff;color:var(--navy);border:1.5px solid var(--line);border-radius:16px;padding:14px;font:15px/1.5 system-ui;resize:vertical;box-shadow:0 4px 14px rgba(23,32,44,.05)}
textarea:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:99px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(232,16,26,.22)}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line);box-shadow:none;flex:0 0 auto;padding:15px 20px;font-size:18px}
.note{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
.note a{color:var(--navy);font-weight:600}
.powered{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--muted)}
.powered img{height:22px}
.overlay{position:fixed;inset:0;background:rgba(23,32,44,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:22px;padding:26px 22px;max-width:360px;width:100%;text-align:center}
.modal .tick{width:52px;height:52px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:28px;line-height:52px}
.modal h3{margin:0 0 12px;font-size:19px}
.modal ol{text-align:left;margin:0 0 18px;padding-left:20px;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap" id="app"><p>Loading…</p></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="tick">✓</div>
    <h3>Your review is copied</h3>
    <ol>
      <li>Tap <b>Continue</b> to open Google</li>
      <li>Tap the review box, <b>press &amp; hold</b>, choose <b>Paste</b></li>
      <li>Tap <b>Post</b></li>
    </ol>
    <button class="btn" id="go" style="width:100%">Continue to Google</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const slug = params.get('c') || 'demo';
let C, rating = 5, service = '';

const T = {
  open: {
    5: ["Excellent experience with {b}.", "Really happy with {b}.", "Highly recommend {b}.", "{b} exceeded my expectations."],
    4: ["Good experience with {b}.", "Pleased with the work from {b}.", "Solid service from {b}."],
    3: ["Decent experience with {b}.", "{b} did an okay job overall."],
    2: ["My experience with {b} was below expectations."],
    1: ["I was disappointed with {b}."]
  },
  mid: {
    5: ["The team really listens before they act.", "Everything was delivered on time and well planned.", "Professional, responsive and easy to work with.", "Communication was clear at every step."],
    4: ["The team was responsive and delivered on time.", "Good communication and a professional approach."],
    3: ["Some things went well, but there is room to improve.", "Delivery was fine, communication could be better."],
    2: ["Communication and delivery could have been better."],
    1: ["Communication and delivery did not meet what was promised."]
  },
  svc: {
    5: s => `Their ${s} work made a real difference for us.`,
    4: s => `Happy with the ${s} work overall.`,
    3: s => `The ${s} work was average.`,
    2: s => `The ${s} work needed more attention.`,
    1: s => `The ${s} work did not meet expectations.`
  },
  close: {
    5: ["Looking forward to working together again.", "Will definitely continue with them.", "Would recommend to anyone looking for this."],
    4: ["Would consider working with them again."],
    3: ["Hoping for improvement next time."],
    2: ["Hope they improve going forward."],
    1: ["I hope they take this feedback on board."]
  }
};
const R = {
  mid: {
    5: ["The staff were friendly and patient and explained everything clearly.", "Very helpful guidance in choosing what suited me.", "Accurate eye check-up and a smooth, hassle-free experience."],
    4: ["Friendly staff and good service.", "Helpful guidance and a smooth experience."],
    3: ["Service was okay, though there is room to improve."],
    2: ["Service and waiting time could have been better."],
    1: ["The service did not match what I expected."]
  },
  svc: {
    5: s => `Really happy with the ${s} I got here.`,
    4: s => `Satisfied with the ${s}.`,
    3: s => `The ${s} was average.`,
    2: s => `The ${s} could have been better.`,
    1: s => `Not happy with the ${s}.`
  },
  all: 'I found everything I needed in one place.',
  close: {
    5: ["Will definitely visit again.", "Highly recommend to family and friends."],
    4: ["Would visit again."],
    3: ["Hoping for improvement next time."],
    2: ["Hope they improve going forward."],
    1: ["I hope they take this feedback on board."]
  }
};
const pick = a => a[Math.floor(Math.random() * a.length)];

function localReview() {
  const retail = C.type === 'retail';
  const b = C.name, s = service && service !== 'All' ? service.toLowerCase() : '';
  const mid = retail ? R.mid : T.mid, svc = retail ? R.svc : T.svc, close = retail ? R.close : T.close;
  const parts = [pick(T.open[rating]).replace('{b}', b), pick(mid[rating])];
  if (s) parts.push(svc[rating](s));
  else if (service === 'All') parts.push(retail ? R.all : 'We used several of their services and the quality was consistent.');
  parts.push(pick(close[rating]));
  return parts.join(' ');
}

async function generate() {
  const box = $('#text');
  if (C.aiEndpoint) {
    try {
      const r = await fetch(C.aiEndpoint, {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({business: C.name, service, rating})});
      const j = await r.json();
      if (j.review) { box.value = j.review; return; }
    } catch (e) {}
  }
  box.value = localReview();
}

function render() {
  const root = document.documentElement.style;
  if (C.accent) { root.setProperty('--accent', C.accent); root.setProperty('--accent2', C.accent2 || C.accent); }
  document.title = `Review ${C.name}`;
  $('#app').innerHTML = `
    ${C.logo ? `<img class="logo" src="${C.logo}" alt="">` : ''}
    <h1>How was your experience with ${C.name}?</h1>
    <div class="stars" id="stars"></div>
    <h2>Which service?</h2>
    <div class="chips" id="chips"></div>
    <h2>Your review</h2>
    <textarea id="text"></textarea>
    <div class="row">
      <button class="btn sec" id="regen" title="New wording">↻</button>
      <button class="btn" id="post">Copy &amp; post on Google</button>
    </div>
    <p class="note">Edit the text however you like. Please keep it honest and about your real experience.<br>${C.whatsapp ? `Prefer private feedback? <a href="https://wa.me/${C.whatsapp}" target="_blank">Message us on WhatsApp</a>` : ''}</p>
    <div class="powered">Powered by <img src="boostit-logo.png" alt="Boostit" onerror="this.parentNode.style.display='none'"></div>`;
  drawStars(); drawChips();
  $('#regen').onclick = generate;
  $('#post').onclick = postReview;
  generate();
}

function drawStars() {
  $('#stars').innerHTML = [1,2,3,4,5].map(n => `<button class="${n<=rating?'on':''}" data-n="${n}">★</button>`).join('');
  document.querySelectorAll('#stars button').forEach(b => b.onclick = () => { rating = +b.dataset.n; drawStars(); generate(); });
}
function drawChips() {
  $('#chips').innerHTML = C.services.map(s => `<button class="chip ${s===service?'on':''}">${s}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { service = service === b.textContent ? '' : b.textContent; drawChips(); generate(); });
}

async function postReview() {
  const t = $('#text').value;
  try { await navigator.clipboard.writeText(t); } catch (e) { $('#text').select(); document.execCommand('copy'); }
  $('#overlay').classList.add('show');
  $('#go').onclick = () => { location.href = `https://search.google.com/local/writereview?placeid=${C.placeId}`; };
}

fetch('clients.json').then(r => r.json()).then(all => {
  C = all[slug];
  if (!C) { $('#app').innerHTML = '<p>Business not found.</p>'; return; }
  render();
}).catch(() => $('#app').innerHTML = '<p>Could not load.</p>');
</script>
</body>
</html>
